<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="IRA Intelligence, plataforma de Machine Learning para el análisis de infecciones respiratorias agudas">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070d19"/><stop offset="0.62" stop-color="#0c1930"/><stop offset="1" stop-color="#141329"/></linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#50dce0"/><stop offset="1" stop-color="#ad92ff"/></linearGradient>
    <radialGradient id="nebula"><stop stop-color="#50dce0" stop-opacity=".22"/><stop offset="1" stop-color="#50dce0" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M 32 0 L 0 0 0 32" fill="none" stroke="#58cad6" stroke-width=".6" opacity=".14"/></pattern>
    <filter id="soft"><feGaussianBlur stdDeviation="12"/></filter>
    <clipPath id="frame"><rect x="0" y="0" width="1200" height="340" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#grid)"/>
    <circle cx="1000" cy="145" r="225" fill="url(#nebula)"/>
    <circle cx="380" cy="335" r="180" fill="#723edb" opacity=".08" filter="url(#soft)"/>
    <path d="M36 34H1164M36 306H1164" stroke="#478f9e" stroke-opacity=".3"/>
    <path d="M36 34V306M1164 34V306" stroke="#478f9e" stroke-opacity=".25"/>
    <path d="M53 54H122M53 54V96M1148 54H1079M1148 54V96M53 286H122M53 286V244M1148 286H1079M1148 286V244" fill="none" stroke="#50dce0" stroke-width="2" opacity=".63"/>
    <g fill="none" stroke="url(#glow)" stroke-width="1.7" stroke-linecap="round" opacity=".44">
      <path d="M782 90h70l18-18h120"/>
      <path d="M762 255h120l22 22h215"/>
      <path d="M810 165h65l18-17h50"/>
    </g>
    <g fill="#50dce0">
      <circle cx="782" cy="90" r="3"/><circle cx="990" cy="72" r="3"/>
      <circle cx="762" cy="255" r="3"/><circle cx="1119" cy="277" r="3"/>
      <circle cx="810" cy="165" r="3"/>
    </g>
    <text x="80" y="78" fill="#63e7e8" font-family="'Trebuchet MS',Arial,sans-serif" font-size="15" font-weight="bold" letter-spacing="4">UPCH  /  MACHINE LEARNING LAB</text>
    <text x="76" y="161" fill="#eaf9ff" font-family="'Trebuchet MS',Arial,sans-serif" font-size="65" font-weight="bold" letter-spacing="2">IRA</text>
    <text x="76" y="223" fill="url(#glow)" font-family="'Trebuchet MS',Arial,sans-serif" font-size="59" font-weight="bold" letter-spacing="1">INTELLIGENCE</text>
    <text x="80" y="259" fill="#b1c4d6" font-family="'Trebuchet MS',Arial,sans-serif" font-size="15" letter-spacing="2">INFECCIONES RESPIRATORIAS AGUDAS  /  CASO B</text>
    <text x="80" y="293" fill="#71aab8" font-family="monospace" font-size="13" letter-spacing="1.3">BFS    •    REGRESIÓN LINEAL    •    VISUALIZACIÓN</text>
    <g transform="translate(960,169)">
      <circle r="100" fill="#50dce0" opacity=".045"/>
      <circle r="98" fill="none" stroke="#50dce0" stroke-width="1" stroke-opacity=".28" stroke-dasharray="6 9" class="rotate"/>
      <circle r="78" fill="none" stroke="#916aff" stroke-width="1" stroke-opacity=".38"/>
      <circle r="58" fill="none" stroke="#50dce0" stroke-width="1" stroke-opacity=".16" stroke-dasharray="2 5"/>
      <path d="M 0 -67 V -31 M 0 -31 C -9 -28 -12 -21 -18 -15" fill="none" stroke="#a6fcf9" stroke-width="6" stroke-linecap="round" opacity=".9"/>
      <path d="M -18 -17 C -28 -43 -47 -45 -55 -22 C -64 5 -71 33 -54 51 C -42 62 -22 49 -16 39 C -5 24 -6 4 -12 -14 Z" fill="#50dce0" fill-opacity=".11" stroke="#50dce0" stroke-width="2.5"/>
      <path d="M 18 -17 C 28 -43 47 -45 55 -22 C 64 5 71 33 54 51 C 42 62 22 49 16 39 C 5 24 6 4 12 -14 Z" fill="#b38bff" fill-opacity=".12" stroke="#ab91ff" stroke-width="2.5"/>
      <path d="M -48 23 l 17 0 l 10 -17 l 11 35 l 11 -32 l 11 16 h 35" fill="none" stroke="#dbffff" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" class="pulse"/>
      <circle cx="0" cy="-67" r="4" fill="#e5ffff"/>
    </g>
    <rect x="782" y="40" width="113" height="23" rx="11.5" fill="#0c2933" stroke="#387783"/>
    <text x="797" y="56" fill="#66eeee" font-family="monospace" font-size="11" letter-spacing="1">AI SYSTEM</text>
    <rect x="1040" y="256" width="86" height="24" rx="12" fill="#2a2142" stroke="#69529f"/>
    <text x="1051" y="273" fill="#c4adff" font-family="monospace" font-size="11">2026 // B</text>
  </g>
  <style>
    .pulse{animation:beat 3s ease-in-out infinite;transform-origin:0 0}
    .rotate{animation:spin 28s linear infinite;transform-origin:960px 169px}
    @keyframes beat{0%,100%{opacity:.8}50%{opacity:1;filter:drop-shadow(0 0 5px #50dce0)}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @media(prefers-reduced-motion:reduce){.pulse,.rotate{animation:none}}
  </style>
